<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vote Detail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"/>
    <link rel="stylesheet" th:href="@{/css/board.css}" href="/css/board.css" />
</head>
<body class="body-with-header">
    <!-- 공통 헤더 포함 -->
    <div th:replace="~{fragments/common-header :: commonHeader}"></div>

    <div class="container">
        <h2>Voting System</h2>

        <!-- 투표 정보 -->
        <div class="vote-header mb20">
            <div class="title-date">
                <h3 class="mb5" th:text="${vote.title}">투표 제목</h3>
                <div class="form-note2">
                    <span th:text="${vote.allowMultiple ? '복수선택' : '단일선택'}"></span> |
                    <span th:text="${vote.anonymous ? '익명투표' : '공개투표'}"></span> |
                    <span th:text="${#temporals.format(vote.endTime, 'M월 d일 a h:mm')}"></span>
                </div>
            </div>
        </div>

        <!-- 옵션 목록 -->
        <div id="options">
            <div th:each="option : ${vote.options}">
                <div class="vote-box"
                     th:attr="data-option-id=${option.id},
                              data-closed=${isClosed},
                              data-anonymous=${vote.anonymous},
                              data-has-voted=${hasVoted}"
                     onclick="handleOptionClick(this)"
                     th:classappend="${isClosed and option.voteCount == maxVotes} ? ' winner' : ''">

                    <!-- 텍스트와 이미지 둘 다 -->
                    <div class="option-main">
                        <div class="option-left">
                            <span th:text="${option.optionText}" class="option-text">옵션</span>
                            <img th:if="${option.imageUrl != null and !#strings.isEmpty(option.imageUrl)}"
                                 th:src="${option.imageUrl}"
                                 alt="Option Image"
                                 class="option-image"
                                 onclick="showImagePopup(this.src)" />
                        </div>

                        <div class="vote-right">
                            <span th:if="${isClosed and option.voteCount == maxVotes}" class="highlight-inline">※ 최다 득표</span>
                            <span class="vote-count">👤 <span th:text="${option.voteCount}">0</span></span>
                        </div>
                    </div>
                </div>

                <!-- 투표자 목록: vote-box 밖으로 이동 -->
                <div class="voter-list"
                     th:if="${!vote.anonymous and option.voterNames != null}"
                     th:id="'voter-list-' + ${option.id}"
                     style="display: none;">
                    <ul>
                        <li th:each="name : ${option.voterNames}" th:text="${name}">홍길동</li>
                    </ul>
                </div>
            </div>
        </div>


        <!-- 버튼 영역 -->
        <div class="vote-buttons">
            <!-- 투표 버튼: 투표/종료 안 됐을 때만 -->
            <button type="button" th:if="${!isClosed and !hasVoted}" onclick="submitVote()">Vote</button>
            <!-- 종료 버튼: 작성자이면서 종료 안 되었을 때만 -->
            <button type="button" th:if="${isCreator and !isClosed}" onclick="endVote()">End Vote</button>
            <!-- 삭제 버튼: 작성자인 경우에만 -->
            <button type="button" style="background-color: lightgrey;" th:if="${isCreator}" onclick="deleteVote()">Delete Vote</button>
        </div>

        <!-- 안내 문구: 종료되었을 때 -->
        <div class="mt10">
            <span th:if="${isClosed}" style="color: gray; font-style: italic;">※ 투표가 마감되었습니다.</span>
        </div>

        <!-- 참여자 수 -->
        <div class="vote-meta" th:text="${totalParticipants + '명이 투표했습니다.'}">
            0명이 투표했습니다.
        </div>
    </div>

    <!-- 이미지 팝업 모달 -->
    <div id="imageModal" class="modal" onclick="closeImagePopup()">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script th:inline="javascript">
        const isMultiple = /*[[${vote.allowMultiple}]]*/ false;
        const voteId = /*[[${vote.id}]]*/ 0;
        const isClosed = /*[[${isClosed}]]*/ false;
        const isAnonymous = /*[[${isAnonymous}]]*/ false;
        const selectedOptions = new Set();

        function toggleOption(box) {
            if (isClosed) return;

            const optionId = box.getAttribute("data-option-id");

            console.log("optionId : " + optionId);
            console.log("optionId : " + box.classList.contains("selected"));

            if (box.classList.contains("selected")) {
                box.classList.remove("selected");
                selectedOptions.delete(optionId);

            } else {
                console.log("isMultiple : " + isMultiple);

                if (!isMultiple) {
                    document.querySelectorAll(".vote-box").forEach(b => b.classList.remove("selected"));
                    selectedOptions.clear();
                }

                box.classList.add("selected");
                selectedOptions.add(optionId);
            }

            const voteCount = parseInt(box.querySelector(".vote-count span")?.textContent || "0");

            if(!isAnonymous && voteCount > 0) {
                console.log("공개 + 투표자 존재 시 리스트 보여주기");
                showVoters(box);
            }
        }

        function submitVote() {
            if (selectedOptions.size === 0) {
                alert("투표할 항목을 선택해주세요.");
                return;
            }

            const data = {
                voteId: voteId,
                optionIds: Array.from(selectedOptions)
            };

            fetch('/vote/submitVote', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(response => {
                if (response.ok) {
                    alert("투표가 완료되었습니다.");
                    location.reload();
                } else if (response.status === 400) {
                    response.text().then(msg => alert(msg));
                } else {
                    alert("투표 중 오류가 발생했습니다.");
                }
            }).catch(err => {
                console.error(err);
                alert("서버 오류가 발생했습니다.");
            });
        }

        function deleteVote() {
            if (!confirm("정말로 이 투표를 삭제하시겠습니까?")) return;

            fetch(`/vote/delete?voteId=${voteId}`, {
                method: 'DELETE'
            }).then(response => {
                if (response.ok) {
                    alert("투표가 삭제되었습니다.");
                    window.location.href = "/vote/voteBoard"; // 목록으로 이동
                } else {
                    response.text().then(msg => alert("삭제 실패: " + msg));
                }
            }).catch(err => {
                console.error(err);
                alert("서버 오류가 발생했습니다.");
            });
        }

        function endVote() {
            if (!confirm("투표를 종료하시겠습니까?")) return;

            fetch('/vote/endVote?voteId=' + voteId, {
                method: 'POST'
            }).then(response => {
                if (response.ok) {
                    alert("투표가 종료되었습니다.");
                    location.reload(); // 화면 새로고침
                } else {
                    response.text().then(msg => alert("오류: " + msg));
                }
            });
        }

        function handleOptionClick(box) {
            const isClosed = box.dataset.closed === "true";
            const isAnonymous = box.dataset.anonymous === "true";
            const optionId = box.dataset.optionId;
            const voteCount = parseInt(box.querySelector(".vote-count span")?.textContent || "0");

            console.log("isClosed ? " + isClosed);
            console.log("isAnonymous ? " + isAnonymous);
            console.log("optionId ? " + optionId);
            console.log("voteCount ? " + voteCount);

            if (!isClosed) {
                console.log("11111");
                toggleOption(box);

            } else if (!isAnonymous && voteCount > 0) {
                console.log("22222");
                showVoters(box);
            }
        }

        function showVoters(box) {
            const optionId = box.getAttribute("data-option-id");
            const list = document.getElementById("voter-list-" + optionId);
            console.log(list);

            if (list) {
                console.log("Are they displayed? >>> " + list.style.display);
                list.style.display = list.style.display === "block" ? "none" : "block";
            }
        }

        function toggleVoterList(box) {
            const voterList = box.querySelector(".voter-list");

            if (voterList) {
                console.log("조건 진입");
                voterList.style.display = (voterList.style.display === "none" || voterList.style.display === "") ? "block" : "none";
            }
        }

        // 이미지 모달창
        function showImagePopup(src) {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImage");

            modal.style.display = "block";
            modalImg.src = src;

            document.body.classList.add("modal-open");
            document.querySelector(".container")?.classList.add("modal-active");
        }

        function closeImagePopup() {
            document.getElementById("imageModal").style.display = "none";
            document.body.classList.remove("modal-open");
            document.querySelector(".container")?.classList.remove("modal-active");
        }

        // ESC 키 눌렀을 때 닫기
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeImagePopup();
            }
        });

    </script>
    <!-- JS 로직 -->

</body>
</html>

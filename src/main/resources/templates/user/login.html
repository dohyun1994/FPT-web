<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <head th:replace="/fragments/head :: head">
</head>
<body>
<div class="container">
    <h2>Login</h2>
    <p th:text="${message}" th:if="${message ne null}" class="alert alert-primary"></p>
    <form th:action="@{/login}" method="post" onsubmit="return login();">

        <div class="form-group flex-row form-inline">
            <label for="email">ID</label>
            <input type="email" id="email" name="email">
        </div>

        <div class="form-group flex-row form-inline">
            <label for="password">PW</label>
            <input type="password" id="password" name="password" autocomplete="current-password">
        </div>

        <div class="buttons">
            <button type="button" onclick="location.href='/register'">Sign Up</button>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="remember-me" id="remember-me" name="remember-me">
                <label class="form-check-label" for="flexCheckChecked">
                    Remember me
                </label>
                | <a th:href="@{/forgot-password}" class="link-secondary">Forgot password</a>
            </div>
            <button type="submit" id="loginBtn">Login</button>
        </div>
    </form>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <head th:replace="/fragments/head :: head">

</head>
<body class="body-with-header">
<div th:replace="fragments/common-header :: commonHeader"></div>

<div style="display: flex; justify-content: center; align-items: center; height: 200px;">
  <img th:src="@{'/' + ${account.profile_image}}" onerror="this.style.display='none';" style="max-width: 200px; max-height: 200px; border: 1px solid #ccc; padding: 5px;" />
</div>


<div class="container">
  <h2>Profile</h2>
  <form th:action="@{/profile}" th:object="${account}" method="post" enctype="multipart/form-data">


    <div class="form-group">
      <div class="form-inline">
        <label for="email">Email</label>
        <input type="hidden" id="id" name="id" th:field="*{id}" />
        <input type="email" id="email" name="email" th:field="*{email}" placeholder="Email" readonly>
      </div>

    </div>

    <div class="form-group">
      <div class="form-inline">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" th:field="*{password}" placeholder="Password" required>
      </div>
      <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" id="password_error" class="alert alert-danger" role="alert">Password Error</p>

    </div>

    <div class="form-group">
      <div class="form-inline">
        <label for="password2"><span style="display: inline-block; line-height: 1.2;">Confirm<br>Password</span></label>
        <input type="password" id="password2" name="password2" placeholder="Confirm Password" required>
        <button type="button" onclick="checkPassword()">Check</button>
      </div>
    </div>

    <div class="form-group">
      <div class="form-inline">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" th:field="*{name}" placeholder="Name" >
      </div>
    </div>


    <div class="form-group">
      <div class="form-inline">
        <label for="birth">Birth</label>
        <input type="date" id="birth" name="birth" th:field="*{birth}" placeholder="Birth" required>
        <p th:if="${#fields.hasErrors('birth')}" th:errors="*{birth}" class="alert alert-danger" role="alert">BirthDate Error</p>
      </div>
    </div>


    <!-- Profile Image Upload -->
    <div class="form-group">
      <div class="form-inline">
        <label for="imageFile">Profile Image</label>
        <input type="file" id="imageFile" name="imageFile" onchange="previewImage(event)">
      </div>
      <div style="margin-top: 10px;">
        <img id="imagePreview" src="#" alt="Image Preview" style="display: none; max-width: 200px; max-height: 200px; border: 1px solid #ccc; padding: 5px;" />
      </div>
    </div>

    <div class="buttons">
      <button type="submit">Update</button>
      <button type="reset">Cancel</button>
      <button type="button" onclick="window.location.href='/'">Back</button>
    </div>
  </form>
</div>

<script>

  // password Check
  function checkPassword() {
      const pw1 = $('#password').val();
      const pw2 = $('#password2').val();

      if(!pw1 || !pw2) {

          alert('Please enter both password fields.');
          return;
      }
      if(pw1 !== pw2) {
          alert('Password does not meet complexity requirements.');
          return;
      }

      alert("Available password");
      $('#password_error').remove();

  }


  // 이미지 미리보기
  function previewImage(event) {

      const input = event.target;
      const file = input.files[0];

      if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
              $('#imagePreview')
                  .attr('src', e.target.result)
                  .css('display', 'block');
          };
          reader.readAsDataURL(file);
      }
  }

  $(document).ready(function () {

      $("button[type='reset']").on("click", function () {
          $('#profile_image').val(''); // 파일 input 초기화
          $('#imagePreview')
              .attr('src', '')
              .css('display', 'none');
      });
  });


</script>

</body>
</html>

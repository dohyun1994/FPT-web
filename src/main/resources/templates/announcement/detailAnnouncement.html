<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Announcement Detail</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/announce.css">
    <style>
        #map {
            width: 100%;
            height: 350px;
            margin-top: 20px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body class="body-with-header">
<div class="page-wrapper">
    <div class="container">
        <h2>📌 Announcement Detail</h2>

        <div class="form-group">
            <label><strong>Title</strong></label>
            <p>🏷️ Spring Project Team Meeting Notice</p>
        </div>

        <div class="form-group">
            <label><strong>Author</strong></label>
            <p>1234</p>
        </div>

        <div class="form-group">
            <label><strong>Place Name</strong></label>
            <p>대구은행 제2본점</p>
        </div>

        <div class="form-group">
            <label><strong>Address</strong></label>
            <p>111, Oksan-ro, Buk-gu, Daegu, Republic of Korea</p>
        </div>

        <div class="form-group">
            <label><strong>Created At</strong></label>
            <p>2025-05-14 14:30</p>
        </div>

        <div class="form-group">
            <label><strong>Content</strong></label>
            <div class="content-box">
                <p>Hello team members!<br><br>
                    This Friday at 2 PM, we’ll have a mid-project check-in meeting in Room A.<br>
                    Please make sure to attend!<br><br>
                    Thank you :)
                </p>
            </div>
        </div>

        <div class="form-group">
            <label><strong>Attachment</strong></label>
            <p><a href="/files/sample.pdf" download>sample.pdf</a></p>
        </div>

        <div class="form-group">
            <label><strong>Map</strong></label>
            <div id="map"></div>
        </div>

        <div class="buttons">
            <a href="/announce/announcement">
                <button type="button">← Back to List</button>
            </a>
        </div>
    </div>
</div>


<!-- Kakao 지도 SDK -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=8c1dae3aa60f3b6197ff18ebba6027ff"></script>
<script>
    const mapContainer = document.getElementById('map');
    const mapOption = {
        center: new kakao.maps.LatLng(35.884240399231, 128.5882666726), // placex, placey 예: 판교
        level: 3
    };

    const map = new kakao.maps.Map(mapContainer, mapOption);

    const marker = new kakao.maps.Marker({
        map: map,
        position: new kakao.maps.LatLng(35.884240399231, 128.5882666726)
    });
</script>
</body>
</html>
